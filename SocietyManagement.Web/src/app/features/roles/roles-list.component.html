<div class="app-page">
  <app-page-header title="Roles &amp; Permissions" subtitle="Admin and Member are system roles; add custom roles as needed"
                    [breadcrumbs]="[{ label: 'Roles' }]">
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon> Create Role
    </button>
  </app-page-header>

  <app-data-table
    [loading]="loading()"
    [totalCount]="roles().length"
    [showSearch]="false"
    [showPaginator]="false"
    emptyTitle="No roles yet">
    <table mat-table [dataSource]="roles()" table>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let r">
          <strong>{{ r.name }}</strong>
          @if (r.isSystemRole) { <span class="muted"> · system</span> }
        </td>
      </ng-container>
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let r">{{ r.description || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="userCount">
        <th mat-header-cell *matHeaderCellDef>Users</th>
        <td mat-cell *matCellDef="let r">{{ r.userCount }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button [matMenuTriggerFor]="menu"><mat-icon>more_vert</mat-icon></button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="edit(r)"><mat-icon>edit</mat-icon><span>Edit Permissions</span></button>
            @if (!r.isSystemRole) {
              <button mat-menu-item (click)="remove(r)"><mat-icon>delete</mat-icon><span>Delete</span></button>
            }
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </app-data-table>
</div>
